# Sincronizações recorrentes do Mugô Dados, fora do Render.
#
# Por quê: no plano gratuito do Render não existe Cron Job, e o serviço web
# dorme depois de 15 min sem acesso. Aqui cada job roda num runner do GitHub
# (gratuito em repositório público), grava direto no Supabase e termina; o
# Render fica só para servir o painel, a API e o MCP.
#
# Por que um "tick" a cada 5 min em vez de um horário por job: o GitHub
# descarta ou atrasa boa parte dos disparos agendados (em out/2026, menos da
# metade dos horários rodava), e cada disparo perdido era uma atualização
# perdida. O tick roda todo job cujo horário da agenda ainda não foi atendido
# (server/services/job_dispatcher.py), então qualquer tick que sobreviva
# recupera os perdidos. A agenda de cada job (UTC) mora em SCHEDULE, lá, e
# continua igual à mostrada na tela (src/app/autoRefreshSchedule.ts).
#
# Segurança: o log público mostra só comando, status, duração e contagem de
# falhas (ver .github/scripts/run_job.py). Configuração num único segredo:
# MUGO_JOBS_ENV.
name: Sincronizações (jobs)

on:
  schedule:
    - cron: "*/5 * * * *"      # tick: roda o que estiver pendente na agenda
    - cron: "10 5 * * *"       # Histórico desde 01/01 (Empresas → Histórico), longo e à parte
  workflow_dispatch:
    inputs:
      command:
        description: "Comando do run_jobs.py (ex.: tick --budget-minutes 40 ou organic-sync --limit 60)"
        required: true
        default: "tick --budget-minutes 40"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    concurrency:
      # Um tick por vez; um tick pendente na fila basta (o próximo recupera tudo).
      group: mugo-job-${{ (github.event.schedule == '*/5 * * * *' || startsWith(inputs.command, 'tick')) && 'tick' || github.event.schedule || inputs.command }}
      cancel-in-progress: false
    steps:
      - name: Escolher comando
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.command }}
        run: |
          case "$SCHEDULE" in
            "*/5 * * * *")         cmd="tick --budget-minutes 40" ;;
            "10 5 * * *")          cmd="history-backfill-worker --budget-minutes 150" ;;
            "")                    cmd="$MANUAL" ;;
            *) echo "horário sem comando mapeado"; exit 1 ;;
          esac
          case "$cmd" in
            *[!a-z0-9\ -]*|"") echo "comando inválido"; exit 1 ;;
          esac
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"

      - name: Acordar a API (Render free)
        # O keep-awake próprio também perde disparos; o tick ajuda a manter o
        # painel e o MCP acordados. Em segundo plano, nunca falha o job.
        if: ${{ vars.KEEP_AWAKE != 'off' }}
        run: (curl -s -o /dev/null --max-time 90 https://api.dados.mugoagencia.com.br/health || true) &

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Instalar dependências
        run: pip install -q -r server/requirements.txt

      - name: Rodar job
        env:
          MUGO_JOBS_ENV: ${{ secrets.MUGO_JOBS_ENV }}
          CMD: ${{ steps.pick.outputs.cmd }}
        run: |
          # shellcheck disable=SC2086
          python .github/scripts/run_job.py $CMD
