# Sincronizações recorrentes do Mugô Dados, fora do Render.
#
# Por quê: no plano gratuito do Render não existe Cron Job, e o serviço web
# dorme depois de 15 min sem acesso. Aqui cada job roda num runner do GitHub
# (gratuito em repositório público), grava direto no Supabase e termina; o
# Render fica só para servir o painel, a API e o MCP.
#
# Horários em UTC (São Paulo = UTC-3). Cada horário abaixo dispara UM comando
# (o mapeamento está no passo "Escolher comando"). O GitHub pode atrasar
# disparos agendados em alguns minutos; as janelas dos jobs já cobrem isso.
#
# Segurança: o log público mostra só comando, status e duração (ver
# .github/scripts/run_job.py). Configuração num único segredo: MUGO_JOBS_ENV.
name: Sincronizações (jobs)

on:
  schedule:
    - cron: "15 */6 * * *"     # token Meta
    - cron: "10 6,12,18,23 * * *"  # Instagram orgânico
    - cron: "5 * * * *"        # Meta Ads, últimos 7 dias
    - cron: "20 */3 * * *"     # GA4, últimos 3 dias
    - cron: "35 */3 * * *"     # Google Ads, últimos 7 dias
    - cron: "0,30 * * * *"     # FBITS incremental
    - cron: "15,45 * * * *"    # Shopify incremental
    - cron: "25 7 * * *"       # Shopify, conferência de 14 dias
    - cron: "40 8 * * 0"       # Shopify, conferência de 90 dias (domingo)
    - cron: "45 2 * * *"       # Meta Ads, conferência de 30 dias
    - cron: "*/10 * * * *"     # Meta Ads, fila de histórico
    - cron: "15 3 * * *"       # GA4, conferência de 30 dias
    - cron: "45 3 * * *"       # Google Ads, conferência de 30 dias
    - cron: "20 9 * * 0"       # Instagram, conferência ampla (domingo)
    - cron: "10 5 * * *"       # Histórico desde 01/01 (Empresas → Histórico)
    - cron: "15 13 * * 5"      # Sexta 10h15 (SP): aprendizado por campanha + resumo semanal no WhatsApp
    - cron: "40 10 * * *"      # 7h40 (SP): clipping da marca (Google Notícias)
    - cron: "20 12 1 * *"      # Dia 1, 9h20 (SP): sugestão mensal do perfil da marca (IA avançada)
    - cron: "50 * * * *"       # Avisos ao time que o CRM não recebeu na hora (cliente aprovou/pediu ajuste/editou)
    - cron: "*/5 * * * *"      # Automações: processa a fila (sem AUTOMATIONS_SEND_ENABLED=true só simula)
    - cron: "*/15 * * * *"     # Google Calendar da Mugô: sincroniza reuniões e agenda os lembretes
    - cron: "2-59/5 * * * *"   # Instagram: gatilhos de comentário (resposta + Direct); sem IG_AUTOREPLY_ENABLED só simula
    - cron: "4-59/5 * * * *"     # Instagram: publica posts aprovados e agendados (sem IG_PUBLISH_ENABLED=true só simula)
  workflow_dispatch:
    inputs:
      command:
        description: "Comando do run_jobs.py (ex.: ga4-sync-all --days 3)"
        required: true
        default: "ga4-sync-all --days 3"

permissions:
  contents: read
  issues: write   # só para o alerta de jobs parados (abre/fecha uma issue, sem segredo nenhum no texto)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    concurrency:
      group: mugo-job-${{ github.event.schedule || inputs.command }}
      cancel-in-progress: false
    steps:
      - name: Escolher comando
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.command }}
        run: |
          case "$SCHEDULE" in
            "15 */6 * * *")        cmd="token-refresh" ;;
            "10 6,12,18,23 * * *") cmd="organic-sync --limit 60" ;;
            "5 * * * *")           cmd="ads-sync-hourly --days 7" ;;
            "20 */3 * * *")        cmd="ga4-sync-all --days 3" ;;
            "35 */3 * * *")        cmd="google-ads-sync --days 7" ;;
            "0,30 * * * *")        cmd="fbits-sync-all" ;;
            "15,45 * * * *")       cmd="shopify-reconcile --fallback-days 30" ;;
            "25 7 * * *")          cmd="shopify-historical-reconcile --days 14" ;;
            "40 8 * * 0")          cmd="shopify-historical-reconcile --days 90" ;;
            "45 2 * * *")          cmd="ads-sync-hourly --days 30" ;;
            "*/10 * * * *")        cmd="ads-backfill-worker" ;;
            "15 3 * * *")          cmd="ga4-sync-all --days 30" ;;
            "45 3 * * *")          cmd="google-ads-sync --days 30" ;;
            "20 9 * * 0")          cmd="organic-sync --limit 250 --skip-thumbnails" ;;
            "10 5 * * *")          cmd="history-backfill-worker --budget-minutes 150" ;;
            "15 13 * * 5")         cmd="studio-weekly-digest" ;;
            "50 * * * *")          cmd="studio-team-retry" ;;
            "*/5 * * * *")         cmd="automations-process" ;;
            "*/15 * * * *")        cmd="calendar-sync" ;;
            "2-59/5 * * * *")      cmd="ig-engagement-run" ;;
            "4-59/5 * * * *")      cmd="ig-publish-due" ;;
            "40 10 * * *")         cmd="studio-clipping" ;;
            "20 12 1 * *")         cmd="brand-profile-monthly" ;;
            "")                    cmd="$MANUAL" ;;
            *) echo "horário sem comando mapeado"; exit 1 ;;
          esac
          case "$cmd" in
            *[!a-z0-9\ -]*|"") echo "comando inválido"; exit 1 ;;
          esac
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Instalar dependências
        run: pip install -q -r server/requirements.txt

      - name: Rodar job
        env:
          MUGO_JOBS_ENV: ${{ secrets.MUGO_JOBS_ENV }}
          CMD: ${{ steps.pick.outputs.cmd }}
        run: |
          # shellcheck disable=SC2086
          python .github/scripts/run_job.py $CMD

      # Alerta de jobs parados: uma issue só (label jobs-parados). Abre na 1ª falha, atualiza o corpo nas
      # seguintes (sem spam de comentários) e fecha sozinha quando um job volta a dar certo. O GitHub
      # avisa por e-mail quem acompanha o repositório. Funciona mesmo com o MUGO_JOBS_ENV quebrado.
      - name: Alerta de job com falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CMD: ${{ steps.pick.outputs.cmd }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create jobs-parados --color B22234 --description "Jobs automáticos falhando" 2>/dev/null || true
          now="$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          number="$(gh issue list --label jobs-parados --state open --json number --jq '.[0].number // empty')"
          body="Último job com falha: \`${CMD%% *}\` em ${now} (horário de Brasília).

          Execução: ${RUN_URL}

          Causa mais comum: segredo MUGO_JOBS_ENV incompleto (ele precisa do bloco inteiro de variáveis do Render).
          Esta issue fecha sozinha quando um job voltar a rodar com sucesso."
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "Jobs automáticos falhando" --label jobs-parados --body "$body"
          fi

      - name: Fecha o alerta quando volta a funcionar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CMD: ${{ steps.pick.outputs.cmd }}
        run: |
          for number in $(gh issue list --label jobs-parados --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Voltou: \`${CMD%% *}\` rodou com sucesso em $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')."
          done
