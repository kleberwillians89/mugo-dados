# Roda os testes do MUGOVERSO em todo PR e em todo push na main.
# Repositório público: os minutos do GitHub Actions são gratuitos.
# Nada aqui usa segredo, banco ou API de verdade: os testes são isolados (mocks).
name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r server/requirements.txt -r server/requirements-test.txt
      - run: npm run test:backend
