name: Channels 000113 type preflight (isolated PostgreSQL)
on:
  pull_request:
  push:
    branches: [fix/channels-113-text-fk-preflight]
permissions:
  contents: read
jobs:
  channels-fk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: channels_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d channels_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHANNELS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/channels_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.9'
      - run: python server/tests/check_channels_113_fk.py
