# Isolated SQL smoke test: uses disposable PostgreSQL, never Supabase project.
name: Commercial migration 000113 (isolated PostgreSQL)
on:
  pull_request:
    paths:
      - 'supabase/migrations/20270104_000113_tenant_commercial_modules.sql'
      - 'server/tests/check_tenant_commercial_sql.py'
      - '.github/workflows/commercial-migration-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commercial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commercial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COMMERCIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commercial_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - run: python server/tests/check_tenant_commercial_sql.py
