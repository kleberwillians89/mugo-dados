# Relógio dos jobs do Mugô Dados: a cada 5 minutos roda, em paralelo, os comandos que estão no horário.
#
# Por quê: com ~24 horários próprios, o agendador do GitHub descartava a maior parte dos disparos
# (04/11: 20 execuções em 8 h). Agora o disparo principal vem de fora (cron-job.org chamando o
# workflow_dispatch deste arquivo a cada 5 min); o schedule abaixo fica só de reserva. Se os dois
# dispararem na mesma janela, o segundo não roda nada (ver "Já rodou nesta janela?").
#
# A agenda (horário → comando) está em .github/scripts/due_jobs.py. Execução manual de um comando
# avulso continua em "Sincronizações (jobs)" → Run workflow.
name: Relógio dos jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # reserva: o GitHub pode atrasar ou pular

permissions:
  contents: read
  actions: read   # só para ver se esta janela já rodou
  issues: write   # alerta de jobs parados (abre/fecha uma issue, sem segredo no texto)

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      commands: ${{ steps.due.outputs.commands }}
      slot: ${{ steps.due.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: O que está no horário
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$(python3 .github/scripts/due_jobs.py)"
          slot="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["slot"])')"
          commands="$(echo "$out" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["commands"]))')"
          # Já rodou nesta janela? (disparo externo + reserva do GitHub no mesmo intervalo)
          earlier="$(gh api "repos/${{ github.repository }}/actions/workflows/jobs-tick.yml/runs?created=>=${slot}&per_page=50" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length" || echo 0)"
          if [ "${earlier:-0}" != "0" ]; then echo "janela ${slot} já rodou"; commands="[]"; fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "commands=$commands" >> "$GITHUB_OUTPUT"
          echo "janela=$slot comandos=$commands"

  run:
    needs: plan
    if: ${{ needs.plan.outputs.commands != '[]' && needs.plan.outputs.commands != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cmd: ${{ fromJSON(needs.plan.outputs.commands) }}
    concurrency:
      group: mugo-job-${{ matrix.cmd }}
      cancel-in-progress: false
    steps:
      - name: Validar comando
        env:
          CMD: ${{ matrix.cmd }}
        run: |
          case "$CMD" in
            *[!a-z0-9\ -]*|"") echo "comando inválido"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Instalar dependências
        run: pip install -q -r server/requirements.txt

      - name: Rodar job
        env:
          MUGO_JOBS_ENV: ${{ secrets.MUGO_JOBS_ENV }}
          CMD: ${{ matrix.cmd }}
        run: |
          # shellcheck disable=SC2086
          python .github/scripts/run_job.py $CMD

      - name: Alerta de job com falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CMD: ${{ matrix.cmd }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create jobs-parados --color B22234 --description "Jobs automáticos falhando" 2>/dev/null || true
          now="$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          number="$(gh issue list --label jobs-parados --state open --json number --jq '.[0].number // empty')"
          body="Último job com falha: \`${CMD%% *}\` em ${now} (horário de Brasília).

          Execução: ${RUN_URL}

          Causa mais comum: segredo MUGO_JOBS_ENV incompleto (ele precisa do bloco inteiro de variáveis do Render).
          Esta issue fecha sozinha quando um job voltar a rodar com sucesso."
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "Jobs automáticos falhando" --label jobs-parados --body "$body"
          fi

      - name: Fecha o alerta quando volta a funcionar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CMD: ${{ matrix.cmd }}
        run: |
          for number in $(gh issue list --label jobs-parados --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Voltou: \`${CMD%% *}\` rodou com sucesso em $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')."
          done
