# O nome aqui precisa casar com o serviço real no Render: um nome diferente
# faz o Blueprint criar OUTRO serviço em vez de atualizar o existente, e foi
# por isso que estes Cron Jobs nunca passaram a existir em produção.
# Serviço web real: mugo-dados.
services:
  - type: web
    name: mugo-dados
    env: python
    plan: starter
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py # run_api.py desabilita access_log explicitamente
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: APP_ENV
        value: production
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        value: https://api.dados.mugoagencia.com.br/api/oauth/shopify/callback

  - type: cron
    name: mugo-dados-meta-token-refresh
    env: python
    plan: starter
    rootDir: server
    schedule: "15 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py token-refresh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-instagram-organic-sync
    env: python
    plan: starter
    rootDir: server
    schedule: "10 6,12,18,23 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py organic-sync --limit 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-meta-ads-sync-hourly
    env: python
    plan: starter
    rootDir: server
    schedule: "5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py ads-sync-hourly --days 7
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-ga4-sync
    env: python
    plan: starter
    rootDir: server
    schedule: "20 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py ga4-sync-all --days 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-google-ads-sync
    env: python
    plan: starter
    rootDir: server
    schedule: "35 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py google-ads-sync --days 7
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  # FBITS/Wake: 120 req/min por token e bloqueio de 1h ao insistir no 429.
  # O incremental lê só a janela do marcador persistido menos 2h, então de
  # 30 em 30 minutos fica longe do limite. Os KPIs executivos continuam
  # vindo de GET /dashboard/faturamento; este job atualiza o analítico.
  - type: cron
    name: mugo-dados-fbits-incremental
    env: python
    plan: starter
    rootDir: server
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py fbits-sync-all
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-shopify-incremental
    env: python
    plan: starter
    rootDir: server
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py shopify-reconcile --fallback-days 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-shopify-historical-reconciliation
    env: python
    plan: starter
    rootDir: server
    schedule: "25 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py shopify-historical-reconcile --days 14
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-shopify-wide-reconciliation
    env: python
    plan: starter
    rootDir: server
    schedule: "40 8 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py shopify-historical-reconcile --days 90
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-meta-ads-wide-reconciliation
    env: python
    plan: starter
    rootDir: server
    schedule: "45 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py ads-sync-hourly --days 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-meta-ads-backfill-worker
    env: python
    plan: starter
    rootDir: server
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py ads-backfill-worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-ga4-wide-reconciliation
    env: python
    plan: starter
    rootDir: server
    schedule: "15 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py ga4-sync-all --days 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-google-ads-wide-reconciliation
    env: python
    plan: starter
    rootDir: server
    schedule: "45 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py google-ads-sync --days 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  - type: cron
    name: mugo-dados-instagram-wide-reconciliation
    env: python
    plan: starter
    rootDir: server
    schedule: "20 9 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_jobs.py organic-sync --limit 250 --skip-thumbnails
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
