# O nome aqui precisa casar com o serviço real no Render: um nome diferente
# faz o Blueprint criar OUTRO serviço em vez de atualizar o existente, e foi
# por isso que estes Cron Jobs nunca passaram a existir em produção.
# Serviço web real: mugo-dados.
#
# Plano gratuito: o Render não oferece Cron Job no free. As sincronizações
# recorrentes (Meta, GA4, Google Ads, FBITS, Shopify, Instagram e a busca de
# histórico) rodam no GitHub Actions: .github/workflows/sync-jobs.yml.
# Não recrie Cron Jobs aqui: cada um é um serviço pago.
services:
  - type: web
    name: mugo-dados
    env: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py # run_api.py desabilita access_log explicitamente
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: APP_ENV
        value: production
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        value: https://api.dados.mugoagencia.com.br/api/oauth/shopify/callback
